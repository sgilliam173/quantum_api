[project]
name = "quantum-api-bench"
version = "0.1.0"
description = ""
authors = [
    {name = "Sean Gilliam",email = "seangilliam173@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.134.0,<0.135.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "qiskit (>=2.3.0,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "qiskit-ibm-runtime (>=0.45.1,<0.46.0)",
    "qiskit-aer (>=0.17.2,<0.18.0)"
]

[tool.poetry]
packages = [{include = "quantum_api_bench", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["src/quantum_api_bench/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "hardware: marks tests that require IBM Quantum access (deselect with -m 'not hardware')",
    "slow: marks slow tests",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-httpx (>=0.36.2,<0.37.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
